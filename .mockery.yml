all: false
dir: '{{.InterfaceDir}}/mocks'
filename: '{{.InterfaceName}}.go'
force-file-write: true
formatter: goimports
generate: true
include-auto-generated: false
log-level: info
structname: '{{.InterfaceName}}'
pkgname: '{{.SrcPackageName}}'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  github.com/gosoline-project/sqlc:
    config:
      all: false
    interfaces:
      Client: {}
      Driver: {}
      IsNullable: {}
      LifecycleManager: {}
      Querier: {}
      Result: {}
      Sqler: {}
      Tx: {}
  database/sql/driver:
    config:
      dir: ./mocks/driver
      pkgname: driver
    interfaces:
      Conn: {}
      Driver: {}
